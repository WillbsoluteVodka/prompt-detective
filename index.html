<meta charset="utf-8">
<title>Prompt 逆推场</title>
<style>
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#6B6B6B; --line:#DADADA;
  --good:#1A7F37; --warn:#9A6700; --bad:#C62828;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --ink:#EDEDED; --muted:#9A9A9A; --line:#333333; --good:#56C271; --warn:#E0A93B; --bad:#F27B7B;
}}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#EDEDED; --muted:#9A9A9A; --line:#333333; --good:#56C271; --warn:#E0A93B; --bad:#F27B7B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:clamp(17px,1.3vw,24px)/1.65 var(--sans);padding-inline:clamp(20px,2.5vw,48px);padding-block:24px 32px}
main{min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{position:relative;z-index:11;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 28px;margin-bottom:32px}
.top h1{font-size:1em;font-weight:700;margin:0}
#nav{display:flex;gap:20px;flex:1}
#nav button{padding-bottom:2px;border-bottom:2px solid transparent;color:var(--muted)}
#nav button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}

.stage{display:grid;grid-template-columns:1fr 1fr;flex:1}
.stage>div{min-width:0}
.stage>div:first-child{padding-right:24px}
.stage>div:last-child{padding-left:24px;border-left:1px solid var(--line)}
.label{font-size:.7em;color:var(--muted);margin-bottom:8px}
.content{white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(20px,1.8vw,34px);line-height:1.7}
.content.mono{font-family:var(--mono);font-size:clamp(17px,1.5vw,28px)}
.content svg,.content img{display:block;width:100%;height:auto;max-height:48vh;object-fit:contain}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.pair>div{min-width:0}
#answers{margin-top:36px}
#answers .who{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
#answers label{font-weight:700}
#answers .primary{margin-top:12px}
textarea:disabled{opacity:.55}
#shade{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#shade .primary{font-size:clamp(28px,3vw,52px);padding:.5em 1.6em}
textarea{display:block;width:100%;min-height:22vh;resize:vertical;padding:10px 12px;border:1px solid var(--ink);border-radius:0;background:var(--bg);color:var(--ink);font:1em/1.6 var(--mono)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-top:12px}
.primary{background:var(--ink);color:var(--bg);padding:8px 20px;font-weight:700}
.primary:disabled{opacity:.4}
.link{text-decoration:underline;text-underline-offset:3px}

#results{margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
#reveal{width:min(900px,calc(100vw - 40px));max-height:calc(100vh - 80px);overflow:auto;margin:auto;padding:clamp(24px,3vw,48px);border:1px solid var(--ink);background:var(--bg);color:var(--ink)}
#reveal::backdrop{background:rgba(0,0,0,.6)}
#reveal .head{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
#origPrompt{font-size:clamp(20px,1.8vw,32px)!important}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 28px}
.score b{font:700 clamp(44px,4.5vw,80px)/1 var(--mono);font-variant-numeric:tabular-nums}
ul{list-style:none;margin:16px 0 0;padding:0}
li{display:flex;gap:10px;padding-block:3px}
li .mark{flex:none;width:1.2em;font-weight:700}
.hit{color:var(--good)} .near{color:var(--warn)} .miss{color:var(--bad)}
.note{margin:14px 0 0;color:var(--muted)}
#origPrompt{font:1em/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0}
#refList li{font:.85em/1.6 var(--mono);color:var(--muted);overflow-wrap:anywhere}


@media (max-width:680px){
  .stage{grid-template-columns:1fr}
  .pair{grid-template-columns:1fr;gap:24px}
  .stage>div:first-child{padding-right:0}
  .stage>div:last-child{padding-left:0;border-left:none;border-top:1px solid var(--line);margin-top:20px;padding-top:20px}
}
</style>

<main>
  <div class="top">
    <h1>Prompt 逆推场</h1>
    <div id="nav"></div>
    <span class="muted" id="engine" style="font-size:.7em"></span>
    <span class="muted num" id="totalScore"></span>
  </div>

  <div class="stage">
    <div><div class="label">输入</div><div class="content" id="leftPane"></div></div>
    <div><div class="label">输出</div><div class="content" id="rightPane"></div></div>
  </div>

  <div class="pair" id="answers">
    <div>
      <div class="who"><label for="guessA">学生 A</label><span class="muted num" id="timeA"></span></div>
      <textarea id="guessA"></textarea>
      <button class="primary" id="submitA">提交</button>
    </div>
    <div>
      <div class="who"><label for="guessB">学生 B</label><span class="muted num" id="timeB"></span></div>
      <textarea id="guessB"></textarea>
      <button class="primary" id="submitB">提交</button>
    </div>
  </div>

  <div class="pair" id="results" hidden>
    <div id="resA"></div>
    <div id="resB"></div>
  </div>

  <dialog id="reveal">
    <div class="head"><div class="label">原 prompt</div><button class="link" id="closeReveal">关闭</button></div>
    <p id="origPrompt"></p>
    <ul id="revealEls"></ul>
    <div class="label" style="margin-top:20px">同样算对的写法</div>
    <ul id="refList" style="margin-top:0"></ul>
  </dialog>
</main>

<div id="shade"><button class="primary" id="startBtn">开始</button></div>

<script>
(function(){
const bank = JSON.parse(document.getElementById('bank').textContent);
const MAX_TRIES = 3;
const W = {sem:.35, elem:.45, len:.20};
const $ = id => document.getElementById(id);

/* ---------- 状态 ---------- */
let state = {qi:0, rounds:{}, revealed:{}};
const WHO = ['A','B'];
// 每题一轮：phase idle → running → done；两人各自提交，都提交后才评分
const round = q => state.rounds[q.id] || (state.rounds[q.id] = {phase:'idle', start:0, text:{}, time:{}, res:null});

/* ---------- 向量引擎 ---------- */
// 默认：字符 n-gram 词袋向量（中文单字+双字，英文单词），sqrt-TF，余弦相似度
function ngramVec(text){
  const v = new Map(); const add = k => v.set(k,(v.get(k)||0)+1);
  const t = text.toLowerCase();
  (t.match(/[a-z0-9]+/g)||[]).forEach(w => add('w:'+w));
  (t.match(/[一-鿿]+/g)||[]).forEach(run => {
    for(let i=0;i<run.length;i++){ add('c:'+run[i]); if(i+1<run.length) add('b:'+run[i]+run[i+1]); }
  });
  let n=0; v.forEach((c,k)=>{ const x=Math.sqrt(c); v.set(k,x); n+=x*x; });
  n=Math.sqrt(n)||1; v.forEach((x,k)=>v.set(k,x/n));
  return v;
}
function cosMap(a,b){ let s=0; const [p,q]=a.size<b.size?[a,b]:[b,a]; p.forEach((x,k)=>{ const y=q.get(k); if(y) s+=x*y; }); return s; }
function cosArr(a,b){ let s=0; for(let i=0;i<a.length;i++) s+=a[i]*b[i]; return s; }

const engines = {
  ngram:  {name:'字符 n-gram 向量', lo:.08, hi:.60, near:.42, embed:async ts=>ts.map(ngramVec), cos:cosMap},
  // bge 的余弦值整体偏高（不相关的句子也有 0.5 左右），所以校准区间比 n-gram 高
  neural: {name:'bge-small-zh', lo:.55, hi:.90, near:.72, embed:null, cos:cosArr}
};
let engine = engines.ngram;

// 后台加载中文 embedding 模型（量化版约 24MB，浏览器会缓存）。加载成功前、或环境不允许下载时，用 n-gram 兜底
const MODEL = 'Xenova/bge-small-zh-v1.5';
(async function loadNeural(){
  const status = t => { $('engine').textContent = t; };
  status('语义模型加载中');
  try{
    const tf = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    tf.env.allowLocalModels = false;
    const pipe = await tf.pipeline('feature-extraction', MODEL, {quantized:true});
    const cache = new Map();
    engines.neural.embed = async ts => {
      const need = [...new Set(ts.filter(t=>!cache.has(t)))];
      if(need.length){ const out = await pipe(need,{pooling:'cls',normalize:true}); out.tolist().forEach((v,i)=>cache.set(need[i],v)); }
      return ts.map(t=>cache.get(t));
    };
    await engines.neural.embed(['预热']);
    engine = engines.neural; status('bge-small-zh');
  }catch(e){ status('n-gram'); }
})();

/* ---------- 评分 ---------- */
const clamp01 = x => Math.max(0, Math.min(1, x));
// 长度单位：一个汉字 = 1，一个英文单词 = 2
const units = t => (t.match(/[一-鿿]/g)||[]).length + 2*(t.match(/[A-Za-z0-9]+/g)||[]).length;
function lenScore(q, text){
  const ls = [q.prompt, ...q.refs].map(units), u = units(text);
  const lo = .5*Math.min(...ls), hi = 1.5*Math.max(...ls);
  if(u < lo) return clamp01(u/lo);
  if(u > hi) return Math.exp(-(u-hi)/hi*1.6);
  return 1;
}
async function scoreGuess(q, text){
  const refs = [q.prompt, ...q.refs];
  const clauses = text.split(/[，。；;,.!?！？\n:：]+/).map(s=>s.trim()).filter(s=>s.length>1);
  const descs = q.elements.map(e=>e.desc);
  const vecs = await engine.embed([text, ...refs, ...descs, ...clauses]);
  const vT = vecs[0], vR = vecs.slice(1,1+refs.length), vD = vecs.slice(1+refs.length, 1+refs.length+descs.length), vC = vecs.slice(1+refs.length+descs.length);

  const rawSem = Math.max(...vR.map(v=>engine.cos(vT,v)));
  const sem = clamp01((rawSem-engine.lo)/(engine.hi-engine.lo));

  const low = text.toLowerCase();
  const hits = q.elements.map((e,i)=>{
    if(e.keywords.some(k=>low.includes(k.toLowerCase()))) return 1;
    const s = vC.length ? Math.max(...vC.map(c=>engine.cos(c,vD[i]))) : 0;
    return s >= engine.near ? .5 : 0;
  });
  const wSum = q.elements.reduce((a,e)=>a+e.weight,0);
  const elem = q.elements.reduce((a,e,i)=>a+e.weight*hits[i],0)/wSum;

  const len = lenScore(q, text);
  // 防刷分：要素分受简洁度折扣；简洁度分只有在内容相关时才拿得到
  const elemEff = elem*(.5+.5*len), lenEff = len*Math.max(sem, elem);
  const total = Math.round(100*(W.sem*sem + W.elem*elemEff + W.len*lenEff));
  return {total, sem, elem, len, hits, rawSem};
}

/* ---------- 渲染 ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(ms){ const t=ms/1000, m=Math.floor(t/60); return (m? m+':'+String((t%60).toFixed(1)).padStart(4,'0') : t.toFixed(1)+'s'); }
function fillPane(el, q, side){
  el.className = 'content'; el.textContent = '';
  const svg = q[side+'Svg'], img = q[side+'Img'];
  if(svg) el.appendChild($('svg-'+svg).content.cloneNode(true));
  else if(img){ const i=new Image(); i.src=img; i.alt=side==='left'?'原图':'处理后的图'; el.appendChild(i); }
  else { el.textContent = q[side]; if(side==='right' && q.rightMono) el.classList.add('mono'); }
}
function renderNav(){
  $('nav').innerHTML = bank.map((q,i)=>`<button data-i="${i}" aria-current="${i===state.qi}">${i+1}</button>`).join('');
  const sum = i => bank.reduce((a,q)=>{ const r=round(q).res; return a+(r?r[i].total:0); },0);
  $('totalScore').textContent = `A ${sum(0)} · B ${sum(1)}`;
}
function renderTimes(){
  const rd = round(bank[state.qi]);
  WHO.forEach(w=>{
    $('time'+w).textContent = rd.time[w]!=null ? fmt(rd.time[w]) : rd.phase==='running' ? fmt(Date.now()-rd.start) : '';
  });
}
function renderControls(){
  const q = bank[state.qi], rd = round(q), rev = !!state.revealed[q.id];
  $('shade').hidden = rd.phase!=='idle';
  WHO.forEach(w=>{
    const sent = rd.time[w]!=null, done = rd.phase==='done';
    $('guess'+w).disabled = sent || rd.phase!=='running';
    $('submit'+w).disabled = !done && (sent || rd.phase!=='running' || units($('guess'+w).value) < 3);
    $('submit'+w).textContent = done ? '揭晓答案' : sent ? '已提交，等待对方' : '提交';
  });
  renderTimes();
}
function renderResults(){
  const q = bank[state.qi], rd = round(q);
  $('results').hidden = !rd.res;
  if(rd.res) WHO.forEach((w,i)=>renderResult($('res'+w), q, rd.res[i], rd.text[w], rd.time[w]));
}
function renderQuestion(){
  const q = bank[state.qi], rd = round(q);
  fillPane($('leftPane'), q, 'left'); fillPane($('rightPane'), q, 'right');
  WHO.forEach(w=>{ $('guess'+w).value = rd.text[w]||''; });
  renderNav(); renderControls(); renderResults();
}
function renderResult(el, q, r, text, time){
  const pct = x => Math.round(x*100), rev = state.revealed[q.id];
  const tips = [];
  if(r.len<.7) tips.push(units(text) < units(q.prompt) ? '写得太短。' : '写得太长，要素分被打折了。');
  if(r.hits.some(h=>h===.5)) tips.push('◐ 表示意思接近但没说准。');
  el.innerHTML = `<div class="score"><b>${r.total}</b><span class="muted num">用时 ${fmt(time)} · 语义 ${pct(r.sem)} · 要素 ${pct(r.elem)} · 简洁 ${pct(r.len)}</span></div><ul>` +
    q.elements.map((e,i)=>{
      const h = r.hits[i], cls = h===1?'hit':h>0?'near':'miss', mark = h===1?'✓':h>0?'◐':'✗';
      return `<li><span class="mark ${cls}">${mark}</span><span>${esc(e.label)}${(h===1||rev)?` <span class="muted">${esc(e.desc)}</span>`:''}</span></li>`;
    }).join('') + `</ul><p class="note">${tips.join(' ')}</p>`;
}

/* ---------- 事件 ---------- */
$('nav').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; state.qi=+b.dataset.i; renderQuestion(); });
$('startBtn').addEventListener('click', ()=>{ const rd=round(bank[state.qi]); rd.phase='running'; rd.start=Date.now(); renderControls(); $('guessA').focus(); });
WHO.forEach(w=>{
  $('guess'+w).addEventListener('input', ()=>{ round(bank[state.qi]).text[w]=$('guess'+w).value; renderControls(); });
  $('submit'+w).addEventListener('click', async ()=>{
    const q = bank[state.qi], rd = round(q);
    if(rd.phase==='done'){ openReveal(q); return; }
    rd.time[w] = Date.now()-rd.start;
    rd.text[w] = $('guess'+w).value.trim();
    if(WHO.every(x=>rd.time[x]!=null)){
      rd.res = await Promise.all(WHO.map(x=>scoreGuess(q, rd.text[x])));
      rd.phase = 'done';
    }
    if(bank[state.qi]===q){ renderNav(); renderControls(); renderResults(); }
  });
});
function openReveal(q){
  state.revealed[q.id] = true;
  $('origPrompt').textContent = q.prompt;
  $('revealEls').innerHTML = q.elements.map(e=>`<li><span class="muted">${esc(e.label)} ×${e.weight}</span><span>${esc(e.desc)}</span></li>`).join('');
  $('refList').innerHTML = q.refs.map(r=>`<li>${esc(r)}</li>`).join('');
  renderResults();
  $('reveal').showModal();
}
$('closeReveal').addEventListener('click', ()=>$('reveal').close());
$('reveal').addEventListener('click', e=>{ if(e.target===$('reveal')) $('reveal').close(); });
setInterval(renderTimes, 100);

renderQuestion();
})();
</script>
